<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 100" width="100%" height="100" font-family="monospace" font-size="11">
  <rect x="0" y="0" width="600" height="100" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>

  <!-- Step 1 -->
  <text x="14" y="18" fill="#3fb950" font-weight="bold">✓</text>
  <text x="34" y="18" fill="#8b949e">build images</text>

  <!-- Step 2 -->
  <text x="14" y="36" fill="#3fb950" font-weight="bold">✓</text>
  <text x="34" y="36" fill="#8b949e">push to registry</text>

  <!-- Step 3 -->
  <text x="14" y="54" fill="#3fb950" font-weight="bold">✓</text>
  <text x="34" y="54" fill="#8b949e">migrate db</text>

  <!-- Step 4 — busy with spinner -->
  <g transform="translate(20,68)">
    <circle r="5" fill="none" stroke="#21262d" stroke-width="1.5"/>
    <path d="M 0,-5 A 5,5 0 0 1 5,0" fill="none" stroke="#d29922" stroke-width="1.5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.7s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="34" y="72" fill="#c9d1d9">rolling out audio-processor:v1.4</text>

  <!-- Progress bar track -->
  <rect x="14" y="86" width="572" height="4" rx="2" fill="#21262d"/>
  <rect x="14" y="86" width="0"   height="4" rx="2" fill="#3fb950">
    <animate attributeName="width" values="0;572;572" keyTimes="0;0.8;1" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
