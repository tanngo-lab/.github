<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 30" width="100%" height="30">
  <rect x="0" y="0" width="800" height="30" fill="#21262d"/>
  <rect x="0" y="29" width="800" height="1" fill="#30363d"/>

  <!-- traffic light dots -->
  <circle cx="14" cy="15" r="5.5" fill="#ff5f57"/>
  <circle cx="32" cy="15" r="5.5" fill="#febc2e"/>
  <circle cx="50" cy="15" r="5.5" fill="#28c840"/>

  <!-- title -->
  <text x="76" y="19" font-family="monospace" font-size="11" fill="#8b949e">tan@lab — booting tanngo-lab</text>

  <!-- clock (static value, subtle flicker) -->
  <text x="660" y="19" font-family="monospace" font-size="10" fill="#3fb950">04:47:32
    <animate attributeName="opacity" values="1;0.85;1" dur="1s" repeatCount="indefinite"/>
  </text>

  <!-- signal bars (1 → 4, pulsing) -->
  <g>
    <rect x="730" y="20" width="3" height="3"  fill="#3fb950">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" begin="0s"   repeatCount="indefinite"/>
    </rect>
    <rect x="736" y="17" width="3" height="6"  fill="#3fb950">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" begin="0.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="742" y="14" width="3" height="9"  fill="#3fb950">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" begin="0.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="748" y="11" width="3" height="12" fill="#3fb950">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
