<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 110" width="700" height="110" font-family="monospace" font-size="11">
  <rect x="0" y="0" width="700" height="110" fill="#161b22" rx="4"/>
  <rect x="0" y="0" width="3"   height="110" fill="#56d4dd"/>

  <!-- Vertical line connecting commits -->
  <line x1="30" y1="14" x2="30" y2="100" stroke="#56d4dd" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Commit 1 (newest, pulsing) -->
  <circle cx="30" cy="18" r="4" fill="#56d4dd">
    <animate attributeName="r"       values="3;6;4" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="30" cy="18" r="4" fill="none" stroke="#56d4dd" stroke-width="1" stroke-opacity="0.6">
    <animate attributeName="r"       values="4;14" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="48"  y="22" fill="#d29922">f3a91c</text>
  <text x="100" y="22" fill="#bc8cff">tan</text>
  <text x="140" y="22" fill="#c9d1d9">profile: launch tanngo-lab landing</text>
  <text x="630" y="22" fill="#8b949e" font-size="10" text-anchor="end">just now</text>

  <!-- Commit 2 -->
  <circle cx="30" cy="46" r="4" fill="#56d4dd"/>
  <text x="48"  y="50" fill="#d29922">d12e4a</text>
  <text x="100" y="50" fill="#bc8cff">tan</text>
  <text x="140" y="50" fill="#c9d1d9">audio-processor: plan 4 (history+search)</text>
  <text x="630" y="50" fill="#8b949e" font-size="10" text-anchor="end">4d ago</text>

  <!-- Commit 3 -->
  <circle cx="30" cy="74" r="4" fill="#56d4dd"/>
  <text x="48"  y="78" fill="#d29922">b8c701</text>
  <text x="100" y="78" fill="#bc8cff">tan</text>
  <text x="140" y="78" fill="#c9d1d9">audio-processor: plan 3 merged to master</text>
  <text x="630" y="78" fill="#8b949e" font-size="10" text-anchor="end">2w ago</text>

  <!-- Commit 4 -->
  <circle cx="30" cy="100" r="4" fill="#56d4dd"/>
  <text x="48"  y="104" fill="#d29922">a44218</text>
  <text x="100" y="104" fill="#bc8cff">tan</text>
  <text x="140" y="104" fill="#c9d1d9">audio-processor: scaffold + plan 1</text>
  <text x="630" y="104" fill="#8b949e" font-size="10" text-anchor="end">2mo ago</text>
</svg>
