<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 90" width="800" height="90"
     font-family="-apple-system, 'Segoe UI', Helvetica, sans-serif">
  <style>
    svg {
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #59636e;
      --border: #d0d7de;
      --green-bg: #dafbe1;
      --green-fg: #1a7f37;
      --green-border: #aceebb;
      --green-dot: #1a7f37;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0d1117;
        --fg: #f0f6fc;
        --muted: #8b949e;
        --border: #30363d;
        --green-bg: #033a16;
        --green-fg: #4ac26b;
        --green-border: #1a7f37;
        --green-dot: #4ac26b;
      }
    }
    .card { fill: var(--bg); stroke: var(--border); stroke-width: 1; }
    .title { fill: var(--fg); font-size: 13px; font-weight: 600; }
    .sub { fill: var(--muted); font-size: 10px; font-family: ui-monospace, "SF Mono", Consolas, monospace; }
    .meta-label { fill: var(--muted); font-size: 9px; letter-spacing: 0.6px; }
    .meta-value { fill: var(--fg); font-size: 11px; font-family: ui-monospace, "SF Mono", Consolas, monospace; }
    .pill-bg { fill: var(--green-bg); stroke: var(--green-border); stroke-width: 1; }
    .pill-text { fill: var(--green-fg); font-size: 10px; font-weight: 500; }
    .dot { fill: var(--green-dot); }
  </style>

  <!-- Card frame -->
  <rect class="card" x="0.5" y="0.5" width="799" height="89" rx="6"/>

  <!-- Header: title block (left) -->
  <text class="title" x="14" y="22">last deploy</text>
  <text class="sub" x="14" y="36">main · f3a91c</text>

  <!-- Header: status pill (right) -->
  <g transform="translate(712, 13)">
    <rect class="pill-bg" x="0" y="0" width="74" height="20" rx="10"/>
    <circle class="dot" cx="11" cy="10" r="3.5">
      <animate attributeName="opacity" values="1;0.5;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text class="pill-text" x="20" y="14">success</text>
  </g>

  <!-- Meta row: IMAGE column -->
  <text class="meta-label" x="14" y="62">IMAGE</text>
  <text class="meta-value" x="14" y="76">audio-processor:v1.4</text>

  <!-- Meta row: DURATION column -->
  <text class="meta-label" x="280" y="62">DURATION</text>
  <text class="meta-value" x="280" y="76">2m 18s</text>

  <!-- Meta row: WHEN column -->
  <text class="meta-label" x="506" y="62">WHEN</text>
  <text class="meta-value" x="506" y="76">2h ago</text>
</svg>