<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 22" width="800" height="22" font-family="monospace" font-size="10">
  <rect x="0" y="0" width="800" height="22" fill="#21262d" rx="4"/>

  <!-- LIVE LED with rings -->
  <circle cx="14" cy="11" r="3.5" fill="#3fb950">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="14" cy="11" r="3.5" fill="none" stroke="#3fb950" stroke-width="1">
    <animate attributeName="r"       values="3.5;9"   dur="1.5s" begin="0s"    repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0"   dur="1.5s" begin="0s"    repeatCount="indefinite"/>
  </circle>
  <circle cx="14" cy="11" r="3.5" fill="none" stroke="#3fb950" stroke-width="1">
    <animate attributeName="r"       values="3.5;9"   dur="1.5s" begin="0.75s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0"   dur="1.5s" begin="0.75s" repeatCount="indefinite"/>
  </circle>

  <text x="28"  y="14" fill="#8b949e">LIVE</text>

  <!-- Summary -->
  <text x="80" y="14" fill="#8b949e">1 service · busy · self-hosted</text>

  <!-- net: label and sparkline -->
  <text x="350" y="14" fill="#8b949e">net:</text>
  <polyline points="380,11 388,7 396,13 404,5 412,9 420,6 428,12 436,4 444,10 452,7 460,9"
            fill="none" stroke="#3fb950" stroke-width="1.2"
            stroke-dasharray="200" stroke-dashoffset="200">
    <animate attributeName="stroke-dashoffset" from="200" to="0" dur="4s" repeatCount="indefinite"/>
  </polyline>

  <!-- last sync -->
  <text x="786" y="14" fill="#3fb950" text-anchor="end">last sync: just now</text>
</svg>
