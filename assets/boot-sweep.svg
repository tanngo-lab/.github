<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 6" preserveAspectRatio="none" width="800" height="6">
  <defs>
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#3fb950" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#3fb950" stop-opacity="1"/>
      <stop offset="80%"  stop-color="#56d4dd" stop-opacity="1"/>
      <stop offset="100%" stop-color="#56d4dd" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="800" height="6" fill="#161b22"/>
  <rect x="-240" y="0" width="240" height="6" fill="url(#sweepGrad)">
    <animate attributeName="x" from="-240" to="800" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
