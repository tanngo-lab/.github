<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 90" width="800" height="90"
     font-family="-apple-system, 'Segoe UI', Helvetica, sans-serif">
  <style>
    svg {
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #59636e;
      --border: #d0d7de;
      --track: #eaeef2;
      --amber-bg: #fff1e5;
      --amber-fg: #9a6700;
      --amber-border: #f8c886;
      --amber-dot: #d29922;
      --bar-cpu: #d29922;
      --bar-mem: #1a7f37;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0d1117;
        --fg: #f0f6fc;
        --muted: #8b949e;
        --border: #30363d;
        --track: #21262d;
        --amber-bg: #341a00;
        --amber-fg: #d4a72c;
        --amber-border: #9a6700;
        --bar-mem: #4ac26b;
      }
    }
    .card { fill: var(--bg); stroke: var(--border); stroke-width: 1; }
    .title { fill: var(--fg); font-size: 13px; font-weight: 600; }
    .sub { fill: var(--muted); font-size: 10px; font-family: ui-monospace, "SF Mono", Consolas, monospace; }
    .meta-label { fill: var(--muted); font-size: 9px; letter-spacing: 0.6px; }
    .meta-value { fill: var(--fg); font-size: 11px; font-family: ui-monospace, "SF Mono", Consolas, monospace; }
    .pill-bg { fill: var(--amber-bg); stroke: var(--amber-border); stroke-width: 1; }
    .pill-text { fill: var(--amber-fg); font-size: 10px; font-weight: 500; }
    .dot { fill: var(--amber-dot); }
    .track { fill: var(--track); }
    .cpu { fill: var(--bar-cpu); }
    .mem { fill: var(--bar-mem); }
  </style>

  <!-- Card frame -->
  <rect class="card" x="0.5" y="0.5" width="799" height="89" rx="6"/>

  <!-- Header: title block (left) -->
  <text class="title" x="14" y="22">audio-processor</text>
  <text class="sub" x="14" y="36">service · self-hosted</text>

  <!-- Header: status pill (right) -->
  <g transform="translate(728, 13)">
    <rect class="pill-bg" x="0" y="0" width="58" height="20" rx="10"/>
    <circle class="dot" cx="11" cy="10" r="3.5">
      <animate attributeName="opacity" values="1;0.5;1" dur="1s" repeatCount="indefinite"/>
    </circle>
    <text class="pill-text" x="20" y="14">busy</text>
  </g>

  <!-- Meta row: CPU column -->
  <text class="meta-label" x="14" y="58">CPU</text>
  <text class="meta-value" x="14" y="72">65%</text>
  <rect class="track" x="14" y="76" width="220" height="4" rx="2"/>
  <rect class="cpu" x="14" y="76" width="143" height="4" rx="2">
    <animate attributeName="width" values="121;172;92;121" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Meta row: MEM column -->
  <text class="meta-label" x="260" y="58">MEM</text>
  <text class="meta-value" x="260" y="72">180M</text>
  <rect class="track" x="260" y="76" width="220" height="4" rx="2"/>
  <rect class="mem" x="260" y="76" width="62" height="4" rx="2">
    <animate attributeName="width" values="48;79;48" dur="4.4s" repeatCount="indefinite"/>
  </rect>

  <!-- Meta row: UPTIME column -->
  <text class="meta-label" x="506" y="58">UPTIME</text>
  <text class="meta-value" x="506" y="72">3d 14h</text>
</svg>
