<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 18" preserveAspectRatio="none" width="800" height="18">
  <style>
    .col { font: 9px monospace; fill: #3fb950; }
  </style>
  <rect x="0" y="0" width="800" height="18" fill="#0d1117"/>
  <rect x="0" y="0" width="800" height="18" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Each column: a text element animated with translate y -->
  <g class="col" font-family="monospace" font-size="9" fill="#3fb950" opacity="0.7">

    <text x="40" y="0">10110
      <animateTransform attributeName="transform" type="translate" from="0,-20" to="0,40" dur="3s" begin="0s" repeatCount="indefinite"/>
    </text>

    <text x="120" y="0">tan
      <animateTransform attributeName="transform" type="translate" from="0,-20" to="0,40" dur="3s" begin="0.6s" repeatCount="indefinite"/>
    </text>

    <text x="200" y="0">01101
      <animateTransform attributeName="transform" type="translate" from="0,-20" to="0,40" dur="3s" begin="1.2s" repeatCount="indefinite"/>
    </text>

    <text x="280" y="0">ssh
      <animateTransform attributeName="transform" type="translate" from="0,-20" to="0,40" dur="3s" begin="0.3s" repeatCount="indefinite"/>
    </text>

    <text x="380" y="0">10100
      <animateTransform attributeName="transform" type="translate" from="0,-20" to="0,40" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </text>

    <text x="480" y="0">api
      <animateTransform attributeName="transform" type="translate" from="0,-20" to="0,40" dur="3s" begin="0.9s" repeatCount="indefinite"/>
    </text>

    <text x="560" y="0">11001
      <animateTransform attributeName="transform" type="translate" from="0,-20" to="0,40" dur="3s" begin="0.2s" repeatCount="indefinite"/>
    </text>

    <text x="660" y="0">log
      <animateTransform attributeName="transform" type="translate" from="0,-20" to="0,40" dur="3s" begin="1.0s" repeatCount="indefinite"/>
    </text>

    <text x="740" y="0">00111
      <animateTransform attributeName="transform" type="translate" from="0,-20" to="0,40" dur="3s" begin="1.7s" repeatCount="indefinite"/>
    </text>

  </g>
</svg>
