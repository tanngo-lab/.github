<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="100%" height="100" font-family="monospace" font-size="11">
  <rect x="0" y="0" width="800" height="100" fill="#161b22" rx="4"/>
  <rect x="0" y="0" width="3"   height="100" fill="#bc8cff"/>

  <!-- Entry 1 -->
  <g opacity="0">
    <text x="14"  y="20" fill="#8b949e">2026-03-08</text>
    <text x="110" y="20" fill="#d29922" font-weight="bold">WARN</text>
    <text x="160" y="20" fill="#c9d1d9">audio-processor: plan 2 scoped — janitor + retries</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0s" fill="freeze"/>
  </g>

  <!-- Entry 2 -->
  <g opacity="0">
    <text x="14"  y="38" fill="#8b949e">2026-04-05</text>
    <text x="110" y="38" fill="#3fb950" font-weight="bold">SHIP</text>
    <text x="160" y="38" fill="#c9d1d9">audio-processor: plan 2 merged to master</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.6s" fill="freeze"/>
  </g>

  <!-- Entry 3 -->
  <g opacity="0">
    <text x="14"  y="56" fill="#8b949e">2026-04-19</text>
    <text x="110" y="56" fill="#3fb950" font-weight="bold">SHIP</text>
    <text x="160" y="56" fill="#c9d1d9">audio-processor: plan 3 merged to master</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.2s" fill="freeze"/>
  </g>

  <!-- Entry 4 -->
  <g opacity="0">
    <text x="14"  y="74" fill="#8b949e">2026-04-26</text>
    <text x="110" y="74" fill="#58a6ff" font-weight="bold">INFO</text>
    <text x="160" y="74" fill="#c9d1d9">audio-processor: plan 4 (history+search+export) drafted</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.8s" fill="freeze"/>
  </g>

  <!-- Entry 5 — LIVE with green flash -->
  <g opacity="0">
    <rect x="6" y="80" width="788" height="16" fill="#3fb950" fill-opacity="0">
      <animate attributeName="fill-opacity" values="0;0.18;0" dur="2s" begin="2.4s" fill="freeze"/>
    </rect>
    <text x="14"  y="92" fill="#8b949e">2026-05-01</text>
    <text x="110" y="92" fill="#3fb950" font-weight="bold">LIVE</text>
    <text x="160" y="92" fill="#c9d1d9">tanngo-lab: org profile online</text>
    <!-- blinking caret -->
    <rect x="475" y="83" width="6" height="11" fill="#bc8cff">
      <animate attributeName="opacity" values="1;0;1" dur="1s" begin="2.4s" repeatCount="indefinite"/>
    </rect>
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.4s" fill="freeze"/>
  </g>
</svg>
