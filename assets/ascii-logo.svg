<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 70" width="380" height="70" font-family="monospace" font-size="9">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- main ASCII text with hue cycle -->
  <g filter="url(#glow)">
    <text x="0" y="12" xml:space="preserve" fill="#bc8cff">  _                                  _       _
      <animate attributeName="fill"
        values="#bc8cff;#56d4dd;#3fb950;#ff7b72;#bc8cff"
        dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="0" y="22" xml:space="preserve" fill="#bc8cff"> | |_ __ _ _ __  _ __   __ _  ___  | | __ _| |__
      <animate attributeName="fill"
        values="#bc8cff;#56d4dd;#3fb950;#ff7b72;#bc8cff"
        dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="0" y="32" xml:space="preserve" fill="#bc8cff"> | __/ _` | '_ \| '_ \ / _` |/ _ \ | |/ _` | '_ \
      <animate attributeName="fill"
        values="#bc8cff;#56d4dd;#3fb950;#ff7b72;#bc8cff"
        dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="0" y="42" xml:space="preserve" fill="#bc8cff"> | || (_| | | | | | | | (_| | (_) || | (_| | |_) |
      <animate attributeName="fill"
        values="#bc8cff;#56d4dd;#3fb950;#ff7b72;#bc8cff"
        dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="0" y="52" xml:space="preserve" fill="#bc8cff">  \__\__,_|_| |_|_| |_|\__, |\___/_|_|\__,_|_.__/
      <animate attributeName="fill"
        values="#bc8cff;#56d4dd;#3fb950;#ff7b72;#bc8cff"
        dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="0" y="62" xml:space="preserve" fill="#bc8cff">                       |___/
      <animate attributeName="fill"
        values="#bc8cff;#56d4dd;#3fb950;#ff7b72;#bc8cff"
        dur="8s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- cyan glitch shadow (periodic flash, slight x offset) -->
  <g fill="#56d4dd" opacity="0">
    <text x="-2" y="13" xml:space="preserve">  _                                  _       _</text>
    <text x="-2" y="23" xml:space="preserve"> | |_ __ _ _ __  _ __   __ _  ___  | | __ _| |__</text>
    <text x="-2" y="33" xml:space="preserve"> | __/ _` | '_ \| '_ \ / _` |/ _ \ | |/ _` | '_ \</text>
    <text x="-2" y="43" xml:space="preserve"> | || (_| | | | | | | | (_| | (_) || | (_| | |_) |</text>
    <text x="-2" y="53" xml:space="preserve">  \__\__,_|_| |_|_| |_|\__, |\___/_|_|\__,_|_.__/</text>
    <text x="-2" y="63" xml:space="preserve">                       |___/</text>
    <animate attributeName="opacity" values="0;0;0;0.7;0;0.4;0;0" dur="5s" repeatCount="indefinite"/>
  </g>

  <!-- red glitch shadow -->
  <g fill="#f85149" opacity="0">
    <text x="2" y="11" xml:space="preserve">  _                                  _       _</text>
    <text x="2" y="21" xml:space="preserve"> | |_ __ _ _ __  _ __   __ _  ___  | | __ _| |__</text>
    <text x="2" y="31" xml:space="preserve"> | __/ _` | '_ \| '_ \ / _` |/ _ \ | |/ _` | '_ \</text>
    <text x="2" y="41" xml:space="preserve"> | || (_| | | | | | | | (_| | (_) || | (_| | |_) |</text>
    <text x="2" y="51" xml:space="preserve">  \__\__,_|_| |_|_| |_|\__, |\___/_|_|\__,_|_.__/</text>
    <text x="2" y="61" xml:space="preserve">                       |___/</text>
    <animate attributeName="opacity" values="0;0;0;0.7;0;0.4;0;0" dur="5s" begin="0.05s" repeatCount="indefinite"/>
  </g>
</svg>
