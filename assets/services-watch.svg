<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 60" width="800" height="60" font-family="monospace" font-size="11">
  <rect x="0" y="0" width="800" height="60" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>

  <!-- Header row -->
  <text x="14"  y="18" fill="#8b949e" font-size="9" letter-spacing="1">NAME</text>
  <text x="190" y="18" fill="#8b949e" font-size="9" letter-spacing="1">UP</text>
  <text x="270" y="18" fill="#8b949e" font-size="9" letter-spacing="1">CPU</text>
  <text x="400" y="18" fill="#8b949e" font-size="9" letter-spacing="1">MEM</text>
  <text x="540" y="18" fill="#8b949e" font-size="9" letter-spacing="1">STATUS</text>
  <line x1="10" y1="22" x2="790" y2="22" stroke="#30363d" stroke-width="1"/>

  <!-- Pulsing busy dot -->
  <circle cx="14" cy="42" r="4" fill="#d29922">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="r"       values="3.5;4.6;3.5" dur="1s" repeatCount="indefinite"/>
  </circle>

  <!-- Service row text -->
  <text x="30"  y="46" fill="#58a6ff">audio-processor</text>
  <text x="190" y="46" fill="#c9d1d9">3d 14h</text>

  <!-- CPU bar track -->
  <rect x="270" y="40" width="100" height="6" rx="2" fill="#21262d"/>
  <rect x="270" y="40" width="65"  height="6" rx="2" fill="#d29922">
    <animate attributeName="width" values="55;78;42;55" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <text x="376" y="46" fill="#c9d1d9" font-size="10">~65%</text>

  <!-- MEM bar track -->
  <rect x="400" y="40" width="100" height="6" rx="2" fill="#21262d"/>
  <rect x="400" y="40" width="30"  height="6" rx="2" fill="#3fb950">
    <animate attributeName="width" values="25;38;25" dur="5s" repeatCount="indefinite"/>
  </rect>
  <text x="506" y="46" fill="#c9d1d9" font-size="10">180M</text>

  <!-- Spinner (rotating arc) -->
  <g transform="translate(545,42)">
    <circle r="5" fill="none" stroke="#21262d" stroke-width="1.5"/>
    <path d="M 0,-5 A 5,5 0 0 1 5,0" fill="none" stroke="#d29922" stroke-width="1.5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- transcribing label -->
  <text x="558" y="46" fill="#8b949e" font-style="italic">transcribing</text>

  <!-- Audio waveform visualizer (8 bars) -->
  <g transform="translate(635,38)">
    <rect x="0"  y="6" width="2" height="6"  rx="1" fill="#d29922">
      <animate attributeName="height" values="3;9;3"  dur="1.2s" begin="0s"   repeatCount="indefinite"/>
      <animate attributeName="y"      values="9;3;9"  dur="1.2s" begin="0s"   repeatCount="indefinite"/>
    </rect>
    <rect x="4"  y="3" width="2" height="9"  rx="1" fill="#d29922">
      <animate attributeName="height" values="6;12;6" dur="1.2s" begin="0.1s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="6;0;6"  dur="1.2s" begin="0.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="8"  y="0" width="2" height="12" rx="1" fill="#d29922">
      <animate attributeName="height" values="9;14;9" dur="1.2s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="3;-2;3" dur="1.2s" begin="0.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="12" y="5" width="2" height="7"  rx="1" fill="#d29922">
      <animate attributeName="height" values="5;11;5" dur="1.2s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="7;1;7"  dur="1.2s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="16" y="2" width="2" height="10" rx="1" fill="#d29922">
      <animate attributeName="height" values="8;13;8" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="4;-1;4" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="20" y="6" width="2" height="6"  rx="1" fill="#d29922">
      <animate attributeName="height" values="4;10;4" dur="1.2s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="8;2;8"  dur="1.2s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="24" y="1" width="2" height="11" rx="1" fill="#d29922">
      <animate attributeName="height" values="8;13;8" dur="1.2s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="4;-1;4" dur="1.2s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="28" y="4" width="2" height="8"  rx="1" fill="#d29922">
      <animate attributeName="height" values="5;11;5" dur="1.2s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="7;1;7"  dur="1.2s" begin="0.7s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
